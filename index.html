<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Keyfall — Piano Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="back">‹ Songs</button>
  <h1 id="title">Keyfall</h1>
  <select id="song" hidden></select>
  <label>Mode
    <select id="mode">
      <option value="practice">Practice (waits for you)</option>
      <option value="play">Play (in time, scored)</option>
      <option value="listen">Listen (demo)</option>
    </select>
  </label>
  <label>Hand
    <select id="hand">
      <option value="right">Right hand only</option>
      <option value="left">Left hand only</option>
      <option value="both">Both (you play it all)</option>
    </select>
  </label>
  <label>Speed <span id="speedVal">100%</span>
    <input id="speed" type="range" min="40" max="150" step="5" value="100">
  </label>
  <label>Labels
    <select id="labels">
      <option value="keys">Computer keys</option>
      <option value="notes">Note names</option>
      <option value="off">Off</option>
    </select>
  </label>
  <button id="mic" title="Listen to a real piano through the microphone">🎤 Listen: off</button>
  <button id="start" class="primary">Start</button>
  <button id="restart">Restart</button>
  <div id="hud">
    <span>Score <b id="score">0</b></span>
    <span>Streak <b id="streak">0</b></span>
    <span>Accuracy <b id="acc">–</b></span>
    <span id="midi" title="MIDI keyboard status">MIDI: –</span>
  </div>
</header>
<main>
  <canvas id="stage"></canvas>
  <div id="hint">Press Start — or just play freely. Use your computer keyboard, mouse/touch, a MIDI keyboard — or turn on 🎤 Listen and play a real piano. Space = start/pause.</div>
  <div id="results" hidden>
    <div class="card">
      <h2 id="resTitle">Song complete</h2>
      <div id="stars"></div>
      <p id="resBody"></p>
      <p id="resBest"></p>
      <button id="again" class="primary">Play again</button>
      <button id="close">Songs</button>
    </div>
  </div>
</main>
<div id="home">
  <div class="inner">
    <div class="brand">Keyfall</div>
    <p class="sub">Choose a song to practice</p>
    <label class="import">＋ Add your own song (MIDI file)
      <input id="file" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" hidden>
    </label>
    <span id="importMsg"></span>
    <div id="list"></div>
  </div>
</div>
<script src="songs.js"></script>
<script src="app.js"></script>
</body>
</html>
